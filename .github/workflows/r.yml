# The R package (r/, docs/r-package.md): R CMD check on Windows, macOS and
# Linux (x86_64, arm64); on Linux, also with an engine built from this commit,
# so the end-to-end test covers unreleased changes. After a release, and on
# demand, the package also
# installs the released binary with am_install() and runs the demo end to end
# (merge land cover, then travel-time scenarios): the proof that R users get
# a working engine on each platform. A release made by the release workflow
# triggers no `release` event (GITHUB_TOKEN), hence workflow_run.
name: r

on:
  push:
    branches: [main]
    paths: ["r/**", "crates/accessmod-cli/**", ".github/workflows/r.yml"]
  pull_request:
    paths: ["r/**", "crates/accessmod-cli/**", ".github/workflows/r.yml"]
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Release to install (e.g. 6.0.0-alpha.1), or latest
        default: latest

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}${{ matrix.binary && ' + binary' || '' }}
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The released binary is tested after a release and on demand.
      BINARY: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
      VERSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.version || 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      - name: AccessMod binary from the release (am_install)
        if: env.BINARY == 'true'
        shell: bash
        run: |
          R CMD INSTALL r
          Rscript -e 'accessmod::am_install(Sys.getenv("VERSION")); accessmod::am_doctor()'
          Rscript -e 'cat("ACCESSMOD_BIN=", accessmod::am_binary(), "\n", sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE)'

      # With ACCESSMOD_BIN set, tests/testthat/test-demo.R runs the demo end
      # to end; otherwise it is skipped.
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual")'
          error-on: '"warning"'
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"

  # The engine of this commit (system GDAL, debug build) and the end-to-end
  # test against it.
  engine-from-source:
    name: ubuntu + engine from source
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GDAL and PROJ
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libgdal-dev gdal-bin libproj-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p accessmod-cli
      - run: echo "ACCESSMOD_BIN=$PWD/target/debug/accessmod" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual")'
          error-on: '"warning"'
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
