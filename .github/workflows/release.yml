# Release archives (docs/distribution.md): the bundled build of every target,
# packaged by scripts/package.sh; macOS binaries signed and notarized from the
# repository secrets. Desktop installers (docs/desktop.md) wrap the same
# engine: scripts/package-desktop.sh builds both, unsigned for now. A tag v* publishes a GitHub release (a prerelease when
# the version has -alpha/-beta/-rc); a manual run only uploads the archives
# as workflow artifacts, to try the packaging.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Set experimental: true on a target while its bundled build is worked
    # out: the release then holds the others.
    continue-on-error: ${{ matrix.experimental }}
    env:
      # Secrets cannot appear in an if: expose whether macOS signing is set up.
      SIGNING: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, experimental: false }
          - { target: x86_64-apple-darwin, os: macos-15-intel, experimental: false }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, experimental: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, experimental: false }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, experimental: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            desktop -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: WebKitGTK and bundling tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      # PROJ builds proj.db with the sqlite3 command; Windows runners lack it.
      - name: sqlite3 (Windows)
        if: runner.os == 'Windows'
        run: choco install sqlite -y --no-progress

      - name: Signing keychain and notary key (macOS)
        if: runner.os == 'macOS' && env.SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "$APPLE_API_KEY_BASE64" | base64 --decode >"$RUNNER_TEMP/AuthKey.p8"
          {
            echo "ACCESSMOD_SIGN_IDENTITY=$identity"
            echo "ACCESSMOD_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "ACCESSMOD_NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "ACCESSMOD_NOTARY_ISSUER=$APPLE_API_ISSUER"
          } >>"$GITHUB_ENV"

      # The online basemaps' key (a public browser key) is embedded in the build.
      - run: sh scripts/package-desktop.sh ${{ matrix.target }}
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}

      - name: The archive runs (doctor)
        run: |
          dir=dist/accessmod-*-${{ matrix.target }}
          ./$dir/accessmod doctor

      - uses: actions/upload-artifact@v4
        with:
          name: accessmod-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --title "AccessMod ${TAG#v}" --generate-notes $pre
