[package]
name = "accessmod-cli"
description = "accessmod command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "accessmod"
path = "src/main.rs"

[dependencies]
accessmod-core.workspace = true
accessmod-io.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
gdal = "0.19"
serde = { workspace = true }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
