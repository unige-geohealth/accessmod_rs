[package]
name = "accessmod-io"
description = "AccessMod I/O boundary: GDAL/PROJ rasters and vectors, job validation, outputs and reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
accessmod-core.workspace = true
calamine = { version = "0.37", features = ["dates"] }
gdal = "0.19"
# GDALPolygonize, not wrapped by the gdal crate (same version as gdal uses).
gdal-sys = "0.12"
png = "0.18.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
thiserror.workspace = true
unicode-normalization = "0.1.26"

[features]
# Test fixtures (`accessmod_io::fixtures`) for this crate's tests and the CLI's.
fixtures = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
accessmod-io = { path = ".", features = ["fixtures"] }
rust_xlsxwriter = "0.102"
tempfile = "3"

[lints]
workspace = true
