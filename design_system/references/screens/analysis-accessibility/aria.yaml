- tabpanel:
  - radio "clock icon Accessibility" [checked]
  - text:  Accessibility
  - radio "hospital icon Geographic coverage"
  - text:  Geographic coverage
  - radio "table icon Referral"
  - text:  Referral
  - radio "chart-bar icon Zonal statistics"
  - text:  Zonal statistics
  - radio "plus icon Scaling up"
  - text: + Scaling up
  - radio "star icon Optimization"
  - text:  Optimization
