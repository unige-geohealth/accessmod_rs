  - textbox "Select merged land cover layer (raster)"
  - text: Select scenario table (table) (t) scenario processed [bicycling only]
  - textbox "Select scenario table (table)"
  - text: Select existing health facilities layer (vector) (v) facility [demo]
  - textbox "Select existing health facilities layer (vector)"
  - heading "wrench icon Analysis settings" [level=3]:  Analysis settings
  - paragraph: Configure parameters for this analysis.
  - separator
  - text: Type of analysis
  - radio "Isotropic ( ignore DEM )"
  - text: Isotropic ( ignore DEM )
  - radio "Anisotropic ( use DEM )" [checked]
  - text: Anisotropic ( use DEM ) Direction of travel
  - radio "From facilities"
  - text: From facilities
  - radio "Towards facilities" [checked]
  - text: Towards facilities
  - checkbox "Use \"Knight's move\" If enabled, \"Knight's move\" will perform an analysis on 16 neighbors cells instead of 8. Slower, but more accurate."
  - text: Use "Knight's move" If enabled, "Knight's move" will perform an analysis on 16 neighbors cells instead of 8. Slower, but more accurate. Maximum travel time [minutes]
  - spinbutton "Maximum travel time [minutes]": "120"
  - text: Add short tags
  - textbox "Add short tags"
  - heading "square-check icon Validation" [level=3]:  Validation
  - paragraph: Review validation issues and compute.
  - separator
  - text: "Issues:  Please enter at least one tag.  Please select at least one facility. Information:  The scenario has one or more speed of 0 km/h configured. This will translate to “barrier cells” during the analysis. Population on those cells will remain outside all catchments. The population count will be available in the output table and / or in the additional columns if this option is selected."
  - button "Compute" [disabled]
  - heading "Travel scenario" [level=2]
  - paragraph: Define the speed of travel for each land cover class.
  - separator
