- tabpanel:
  - tablist:
    - tab "circle-plus icon Import" [selected]:  Import
    - tab "filter icon Filter" [expanded] [selected]:  Filter
    - tabpanel "filter icon Filter":
      - text: Data type
      - radio "Vector"
      - text: Vector
      - radio "Raster"
      - text: Raster
      - radio "Table"
      - text: Table
      - radio "Config"
      - text: Config
      - radio "All" [checked]
      - text: All Text (any field, case sensitive)
      - textbox "Text (any field, case sensitive)"
      - text: Tags filter
      - combobox "Tags filter"
    - tab "arrows-rotate icon Rename":  Rename
    - tab "download icon Archive":  Archive
    - tab "trash-can icon Delete":  Delete
  - heading "Available data" [level=2]
  - paragraph: Data imported in the project or generated by AccessMod.
  - separator
  - grid:
