[workspace]
resolver = "3"
members = ["crates/accessmod-core", "crates/accessmod-io", "crates/accessmod-server", "crates/accessmod-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
accessmod-core = { path = "crates/accessmod-core" }
accessmod-io = { path = "crates/accessmod-io" }
accessmod-server = { path = "crates/accessmod-server" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
thiserror = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
