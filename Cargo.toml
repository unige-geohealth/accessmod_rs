[workspace]
resolver = "3"
members = ["crates/accessmod-core", "crates/accessmod-io", "crates/accessmod-fetch", "crates/accessmod-server", "crates/accessmod-cli", "xtask"]

[workspace.package]
version = "6.0.0-alpha.5"
edition = "2024"
rust-version = "1.92"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
accessmod-core = { path = "crates/accessmod-core" }
accessmod-io = { path = "crates/accessmod-io" }
accessmod-fetch = { path = "crates/accessmod-fetch" }
accessmod-server = { path = "crates/accessmod-server" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
thiserror = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"

# Dev builds: file and line in panics and backtraces, no variable info;
# dependencies without debug info. Full debug info for one run:
# CARGO_PROFILE_DEV_DEBUG=2. (Full debug info took 70 GB of target/ on macOS.)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
